plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    ndkVersion "25.2.9519653"

    namespace 'com.dazn.business'
    compileSdk 35

    defaultConfig {
        applicationId "com.dazn.business"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"  // ✅ Changes App ID for debug mode
            versionNameSuffix "-debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '11'
    }


   externalNativeBuild {
        cmake {
            path "../jni/CMakeLists.txt"
        }
    }

    aaptOptions {
        additionalParameters "--extra-packages", "com.dazn.business.tuner", "--extra-packages", "com.dazn.business.common"
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
        disable 'Deprecation', 'Unchecked'
    }
}

dependencies {
    // Required AOSP dependencies
    // compileOnly files('../libs/android30.jar')
    compileOnly files('../libs/framework.jar')

    // Additional AOSP libraries
    implementation project(':common')
    implementation project(':partner_support')
    //api 'androidx.tvprovider:tvprovider:1.0.0'


    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core:1.1.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.0.0'

    // Dagger Dependency Injection
    implementation 'com.google.dagger:dagger:2.23'
    implementation 'com.google.dagger:dagger-android:2.23'
    annotationProcessor 'com.google.dagger:dagger-android-processor:2.23'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.23'

    // Auto-Factory & Auto-Value
    annotationProcessor 'com.google.auto.factory:auto-factory:1.0-beta7'
    implementation 'com.google.auto.factory:auto-factory:1.0-beta7'
    annotationProcessor 'com.google.auto.value:auto-value:1.5.3'
    implementation 'com.google.auto.value:auto-value:1.5.3'

    // Guava & Protobuf
    implementation 'com.google.guava:guava:28.1-jre'
    implementation 'javax.inject:javax.inject:1'
    implementation 'com.google.protobuf:protobuf-javalite:3.11.0'



}

preBuild {

        def imlFile = file( project.name + ".iml")
        println 'Change ' + project.name + '.iml order'
        try {
            def parsedXml = (new XmlParser()).parse(imlFile)
            def jdkNode = parsedXml.component[0].orderEntry.find { it.'@type' == 'jdk' }
            parsedXml.component[0].remove(jdkNode)
            def sdkString = "Android API " + android.compileSdkVersion.substring("android-".length()) + " Platform"
            println 'what' + sdkString
            new Node(parsedXml.component[0], 'orderEntry', ['type': 'jdk', 'jdkName': sdkString, 'jdkType': 'Android SDK'])
            groovy.xml.XmlUtil.serialize(parsedXml, new FileOutputStream(imlFile))
        } catch (FileNotFoundException e) {
            // nop, iml not found
            println "no iml found"
        }
}

